name: Deploy to Hostinger

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: GitHub environment providing the isolated Hostinger configuration
        type: string
        required: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: deploy ${{ inputs.deploy_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.deploy_environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
      HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
      HOSTINGER_APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
      HOSTINGER_WEB_PORT: ${{ vars.HOSTINGER_WEB_PORT }}
      HOSTINGER_DEPLOY_NETWORK: caderno-mini-production
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare SSH access
        shell: bash
        run: |
          set -euo pipefail
          : "${HOSTINGER_HOST:?Set HOSTINGER_HOST in the selected GitHub environment}"
          : "${HOSTINGER_USER:?Set HOSTINGER_USER in the selected GitHub environment}"
          : "${HOSTINGER_APP_PATH:?Set HOSTINGER_APP_PATH in the selected GitHub environment}"
          : "${HOSTINGER_WEB_PORT:?Set HOSTINGER_WEB_PORT to a free, loopback-only port in the selected GitHub environment}"
          : "${HOSTINGER_SSH_PRIVATE_KEY:?Set HOSTINGER_SSH_PRIVATE_KEY in the selected GitHub environment}"
          : "${HOSTINGER_KNOWN_HOSTS:?Set HOSTINGER_KNOWN_HOSTS in the selected GitHub environment}"
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          case "$HOSTINGER_SSH_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_SSH_PORT must be numeric" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            /*) ;;
            *) echo "HOSTINGER_APP_PATH must be an absolute path" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            *[!A-Za-z0-9_./-]*) echo "HOSTINGER_APP_PATH may contain only letters, numbers, slash, dot, underscore, and hyphen" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_APP_PATH" in
            */caderno-mini/frontend) ;;
            *) echo "HOSTINGER_APP_PATH must be a dedicated directory ending in /caderno-mini/frontend" >&2; exit 1 ;;
          esac
          case "$HOSTINGER_WEB_PORT" in
            *[!0-9]*|'') echo "HOSTINGER_WEB_PORT must be numeric" >&2; exit 1 ;;
          esac
          if [ "$HOSTINGER_WEB_PORT" -lt 1024 ] || [ "$HOSTINGER_WEB_PORT" -gt 65535 ]; then
            echo "HOSTINGER_WEB_PORT must be between 1024 and 65535" >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify isolated application directory and port
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "set -eu
            app_path='$HOSTINGER_APP_PATH'
            marker=\"\$app_path/.caderno-mini-frontend-deploy\"
            project='caderno-mini-production-frontend'
            web_port='$HOSTINGER_WEB_PORT'
            network='$HOSTINGER_DEPLOY_NETWORK'
            mkdir -p \"\$(dirname \"\$app_path\")\"
            if [ -e \"\$app_path\" ]; then
              if [ ! -f \"\$marker\" ] && [ -n \"\$(find \"\$app_path\" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)\" ]; then
                echo 'Refusing to deploy: the target directory already contains files and has no Cadernô ownership marker.' >&2
                exit 1
              fi
            else
              mkdir -p \"\$app_path\"
            fi
            touch \"\$marker\"
            if docker network inspect \"\$network\" >/dev/null 2>&1; then
              owner=\$(docker network inspect --format '{{ index .Labels \"com.caderno-mini.environment\" }}' \"\$network\")
              if [ \"\$owner\" != 'production' ]; then
                echo 'Refusing to use a Docker network not marked for the Cadernô production deployment.' >&2
                exit 1
              fi
            else
              docker network create --label com.caderno-mini.environment=production \"\$network\" >/dev/null
            fi
            for id in \$(docker ps -aq --filter label=com.docker.compose.project=\$project); do
              working_dir=\$(docker inspect --format '{{ index .Config.Labels \"com.docker.compose.project.working_dir\" }}' \"\$id\")
              if [ \"\$working_dir\" != \"\$app_path\" ]; then
                echo 'Refusing to update a Compose project owned by another directory.' >&2
                exit 1
              fi
            done
            if ss -lntH \"( sport = :\$web_port )\" | grep -q .; then
              owner=\$(docker ps -q --filter label=com.docker.compose.project=\$project --filter publish=\$web_port)
              if [ -z \"\$owner\" ]; then
                echo 'Refusing to deploy: HOSTINGER_WEB_PORT is already used by another VPS service.' >&2
                exit 1
              fi
            fi"

      - name: Copy release to the VPS
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          rsync -az -e "ssh -o StrictHostKeyChecking=yes -p $HOSTINGER_SSH_PORT" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='coverage/' \
            --exclude='*.tsbuildinfo' \
            --exclude='.env' \
            --exclude='.env.checkout' \
            --exclude='.caderno-mini-frontend-deploy' \
            ./ "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_APP_PATH/"

      - name: Configure checkout links
        shell: bash
        env:
          CAKTO_CHECKOUT_ANNUAL_URL: ${{ vars.CAKTO_CHECKOUT_ANNUAL_URL }}
          CAKTO_CHECKOUT_LIFETIME_URL: ${{ vars.CAKTO_CHECKOUT_LIFETIME_URL }}
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          for value in "$CAKTO_CHECKOUT_ANNUAL_URL" "$CAKTO_CHECKOUT_LIFETIME_URL"; do
            if [ -n "$value" ] && [[ ! "$value" =~ ^https://pay\.cakto\.com\.br/[A-Za-z0-9_-]+/?$ ]]; then
              echo 'Cakto checkout URLs must be hosted offer links without a query.' >&2
              exit 1
            fi
          done
          remote="umask 077
          app_path='$HOSTINGER_APP_PATH'
          config_file=\$app_path/.env.checkout
          if [ -L \"\$config_file\" ]; then
            echo 'Refusing to write checkout links through a symlink.' >&2
            exit 1
          fi
          temp_file=\$(mktemp \"\$app_path/.env.checkout.XXXXXX\")
          cat > \"\$temp_file\"
          chmod 600 \"\$temp_file\"
          mv \"\$temp_file\" \"\$config_file\""
          {
            printf 'CAKTO_CHECKOUT_ANNUAL_URL=%s\n' "$CAKTO_CHECKOUT_ANNUAL_URL"
            printf 'CAKTO_CHECKOUT_LIFETIME_URL=%s\n' "$CAKTO_CHECKOUT_LIFETIME_URL"
          } | ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" "$remote"

      - name: Build and restart the service
        shell: bash
        run: |
          set -euo pipefail
          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "set -eu
            cd '$HOSTINGER_APP_PATH'
            export WEB_PORT='$HOSTINGER_WEB_PORT'
            docker compose -f compose.production.yaml --project-name caderno-mini-production-frontend up -d --build
            for attempt in \$(seq 1 30); do
              container=\$(docker compose -f compose.production.yaml --project-name caderno-mini-production-frontend ps -q web)
              health=\$(docker inspect --format '{{.State.Health.Status}}' \"\$container\" 2>/dev/null || true)
              if [ \"\$health\" = healthy ]; then exit 0; fi
              if [ \"\$attempt\" = 30 ]; then
                docker compose -f compose.production.yaml --project-name caderno-mini-production-frontend ps
                echo 'Frontend health check failed.' >&2
                exit 1
              fi
              sleep 2
            done"
