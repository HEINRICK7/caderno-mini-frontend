name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out backend catalog for contract tests
        uses: actions/checkout@v4
        with:
          repository: HEINRICK7/caderno-mini-backend
          ref: feature/sprint-1-backend-foundation
          path: mini-backend
          sparse-checkout: catalog/templates.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Build production container
        run: docker build --build-arg API_BASE_URL=http://api:3000 --tag caderno-mini-frontend:ci .

  deploy-production:
    name: deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    needs: verify
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-hostinger.yml
    secrets: inherit
    with:
      deploy_environment: production
