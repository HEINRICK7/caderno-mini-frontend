services:
  web:
    build:
      context: .
      args:
        API_BASE_URL: http://api:3000
        PUBLIC_APP_URL: https://caderno-express.otimizanegocio.com
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3000
      PUBLIC_APP_URL: https://caderno-express.otimizanegocio.com
    env_file:
      - .env.checkout
    ports:
      - "127.0.0.1:${WEB_PORT:?Set WEB_PORT to a free loopback-only port}:3001"
    networks:
      - production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  production:
    name: caderno-mini-production
    external: true
